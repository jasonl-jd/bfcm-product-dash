:root{color-scheme:dark;--bg:#090a0b;--surface:#141618;--line:#2c3034;--muted:#a5abb2;--text:#f4f5f6;--yellow:#ffdd00;--cyan:#65d7ec;--rose:#ff8794;--green:#86d2b2;font-family:'Gotham Bold',Arial,sans-serif;font-size:14px;letter-spacing:0}

/* Theme follows the supplied revenue model; all fonts remain embedded. */
:root {
  --bg:#000; --surface:#121212; --line:#2e2e2e; --muted:#8a8b8c;
  --text:#fff; --cyan:#43d5b0; --green:#43d5b0; --rose:#c9a2a2;
  --display:'JD Forever','Arial Narrow',Impact,sans-serif;
  --body:'JD Inter Tight','Helvetica Neue',Arial,sans-serif;
  font-family:var(--body); font-size:13.5px; line-height:1.45;
}
body,button,input,select { font-family:var(--body); font-synthesis:none; letter-spacing:0; }
button,input,select { transition:background .15s ease,border-color .15s ease,color .15s ease; }
button,input,select { background:#1b1b1b; border-color:#3d3d3d; border-radius:6px; }
input,select { font-weight:500; }
button.secondary { background:#1b1b1b; }
button:hover,button.secondary:hover { border-color:var(--yellow); background:#242424; }
button.primary { font-weight:700; }
h1,h2,h3 { font-family:var(--display); font-weight:400; font-style:normal; text-transform:uppercase; line-height:1; }
.main-header { background:var(--yellow); color:#000; padding:22px 32px; min-height:122px; border-bottom:0; }
.main-header h1 { color:#000; font-size:68px; margin-top:8px; line-height:.88; }
.main-header .eyebrow { color:#000; font-size:11px; font-weight:700; }
.main-header .header-tools>span { color:#222; font-size:12px; font-weight:500; }
.main-header button { color:#000; background:transparent; border-color:#0006; border-radius:999px; }
.main-header button.primary { color:var(--yellow); background:#000; border-color:#000; }
.main-header button:hover { background:#000; color:var(--yellow); }
.tabs { background:#121212; gap:22px; padding:10px 32px 0; border-bottom:0; }
.tabs button { font:400 30px/1 var(--display); text-transform:uppercase; padding:11px 0 13px; border-radius:0; border-bottom-width:4px; background:transparent; }
.tabs button:hover { color:#fff; }
.tabs button.active { color:var(--yellow); }
.view-path { display:flex; gap:12px; align-items:center; padding:12px 32px; background:#121212; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:11px; text-transform:uppercase; color:var(--muted); }
.view-path b { color:var(--yellow); font-weight:700; }
main { padding:0 32px; }
.controls { padding:19px 0; gap:10px; }
.controls label { font-size:10.5px; font-weight:700; color:var(--muted); }
.controls input,.controls select { font-size:12px; }
.notice { color:#ccc; font-size:12px; line-height:1.6; padding:14px 0; }
.kpis { gap:10px; padding:0 0 6px; }
.kpi,.kpi:first-child,.kpi:nth-child(2),.kpi:nth-child(3) { background:#121212; border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; transition:border-color .2s ease,box-shadow .2s ease; }
.kpi:hover { border-color:var(--yellow); box-shadow:0 0 14px #ffdd0012; }
.kpi label { font-size:10px; line-height:1.5; color:var(--muted); font-weight:700; }
.kpi strong { font:400 49px/1 var(--display); margin:8px 0; white-space:nowrap; }
.kpi:first-child strong { color:var(--yellow); }
.kpi small { display:block; color:#ccc; font-size:11px; line-height:1.45; }
.view-summary { padding:22px 0 17px; }
.view-summary .eyebrow { font-size:10px; color:var(--muted); }
.view-summary h2 { font-size:34px; margin-top:6px; }
.view-summary p { color:#ccc; font-size:13px; line-height:1.5; }
.saved-toggle { color:#ccc; }
.chart-band { border:1px solid var(--line); border-radius:10px; background:#121212; padding:17px 16px 12px; }
.chart-head { align-items:baseline; }
.chart-head h3 { font-size:30px; }
.chart-head>span { color:var(--muted); font-size:11px; max-width:70%; line-height:1.5; }
.canvas-wrap { height:290px; margin-top:17px; }
.tooltip { background:#242424; border:1px solid #3d3d3d; border-top:2px solid var(--yellow); border-radius:8px; font-size:12px; box-shadow:0 12px 28px #0008; }
.tooltip strong { font-weight:700; }
.table-title { padding:23px 0 12px; align-items:baseline; gap:16px; }
.table-title h3 { font-size:30px; }
.table-title span { font-size:11.5px; text-align:right; }
.table-scroll { background:#121212; border-radius:10px; }
table { font-size:12.5px; }
th { background:#1b1b1b; border-bottom:1px solid var(--line); color:var(--muted); }
th button { font-family:var(--body); font-size:10.5px; text-transform:uppercase; padding:10px; color:var(--muted); font-weight:700; border-radius:0; background:transparent; }
th button:hover { color:#fff; background:#242424; }
th[aria-sort=descending] button,th[aria-sort=ascending] button { color:var(--yellow); }
td { padding:10px; border-color:var(--line); }
tr:hover td { background:#1b1b1b; }
.product-button { font-weight:500; font-size:13px; }
.product small { color:var(--muted); font-size:11px; }
.decision { font-size:11px; font-weight:700; }
.decision.hold { color:#a7a8a9; }
.decision.clearance { color:#fff; }
.score { font-weight:700; }
.shortlist-section { padding:22px 0; }
.shortlist-section>h3 { font:400 30px/1 var(--display); }
.shortlist-item { border-radius:10px; padding:16px; }
.shortlist-item p { color:#ccc; font-size:12px; }
.shortlist-item .metrics { gap:22px; font-size:14px; }
.shortlist-item .metrics span { font-size:10.5px; }
.shortlist-item .secondary { border-radius:999px; }
dialog { background:#121212; border-color:#3d3d3d; border-radius:12px; }
.dialog-head h2 { font:400 32px/1 var(--display); }
.dialog-head .close { border-radius:999px; }
.detail-grid strong { font:400 34px/1.05 var(--display); }
.detail-grid small { color:var(--muted); font-size:11px; }
.facts { color:#ccc; font-size:13px; }
.facts b { font-weight:700; }
#detail-content>h3,#audit-content h3 { font:400 28px/1 var(--display); }
#audit-content { color:#ccc; font-size:13px; }
footer { font-size:11px; color:var(--muted); }
@media(min-width:1800px) { .main-header,main { padding-left:40px; padding-right:40px; } .tabs,.view-path { padding-left:40px; padding-right:40px; } }
@media(max-width:1250px) { .kpi strong { font-size:43px; } .tabs { gap:20px; } .tabs button { font-size:27px; } }
@media(max-width:800px) {

 .table-title h3 { font-size:27px; } .table-title span { font-size:10px; max-width:48%; }
 .detail-grid strong { font-size:30px; }
}

 const counts={unmatched:DATA.audit.unmatched,duplicate:DATA.audit.duplicateSkus.length,inventory:state.rows.filter(r=>!BFAnalysis.valid(r.stock)||r.stock<0).length,dates:state.rows.filter(r=>r.issues.some(i=>/date|launch|end/i.test(i))).length,margin:state.rows.filter(r=>r.margin===null||r.margin<0).length};

mmendations. Net units and net sales include returns; refund-adjustment rows and zero-value shipping rows follow the dashboard exclusions. No SKU match in the loaded history means unknown, not proven zero demand. Weeks of cover = online available units / average weekly positive units before returns; zero demand is displayed separately, not as infinite coverage. This is historical cover, not a BF forecast.</p><h3>Pricing &amp; margin</h3><p>Current online price = CN; MSRP = CJ; planned BF price = CW; unit cost = CQ. Gross profit per unit = BF price - cost. BF margin = gross profit / BF price. Margin change is versus current online margin. Units / regular GP = (MSRP - cost) / (BF price - cost); unavailable for nonpositive BF profit. These are gross margins, excluding tax, shipping, fulfilment and marketing costs. Inventory-weighted margin uses only unique products with valid costs, positive stock and valid BF prices.</p><h3>Priority methodology</h3><p>Heuristic score: 40% demand percentile (40% latest net units + 60% prior-four-week average); 20% unit momentum, capped at -100% to +100%; 20% cover, capped at six weeks; 20% margin, capped at 60%. Scores are calculated before display filters and are not forecasts. Hero: no holds, score at least 65, blended units at least five and positive latest units. Clearance: no holds and cover above 12 weeks, no positive recent unit sales, or blended units below two. Other eligible offers are supporting products. All rule failures are visible in product details.</p><h3>Publication</h3><p>This HTML embeds product costs, margins, inventory and aggregate sales. A public repository or public Pages site exposes that data. Use approved restricted hosting for confidential commercial information. No individual order records are included.</p>`;
