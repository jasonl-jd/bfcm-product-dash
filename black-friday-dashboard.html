<header class="main-header"><div><span class="eyebrow">CAMPAIGN PLANNING / 2026</span><h1>Black Friday</h1></div><div class="header-tools"><span id="source-label"></span><button id="audit-open" class="secondary">Data &amp; methodology</button><button id="export" class="primary">Export CSV</button></div></header>
<main>
<section class="controls" aria-label="Campaign filters">
 <label class="search-label">Product lookup<input id="search" type="search" placeholder="Name or SKU" autocomplete="off"></label>
 <label>Campaign<select id="campaign"><option value="first">First drop / Nov 14-25</option><option value="second">New launches / Nov 26 onward</option><option value="all">All planned offers</option></select></label>
 <label>Sales week<select id="week"></select></label>
 <label>Brand<select id="brand"><option value="">All brands</option></select></label>
 <label>Department<select id="department"><option value="">All departments</option></select></label>
 <label>Franchise<select id="franchise"><option value="">All franchises</option></select></label>
 <label>Decision<select id="bucket"><option value="">All decisions</option><option>Hero Features</option><option>Supporting Products</option><option>Clearance Focus</option><option>Hold Back</option></select></label>
 <label>BF price, max<input id="price-max" type="number" min="0" step="5" placeholder="Any"></label>
 <button id="reset" class="secondary clear">Clear filters</button>
</section>
<div class="notice" id="notice"></div>
<section class="kpis" id="kpis" aria-label="Filtered campaign totals"></section>
<nav class="tabs" aria-label="Analysis views"><button data-view="priority" class="active">Priority Products</button><button data-view="shortlist">Campaign Shortlist</button><button data-view="inventory">Inventory</button><button data-view="momentum">Sales Momentum</button><button data-view="margin">Pricing &amp; Margin</button></nav>
<section class="view-summary"><div><span class="eyebrow" id="view-kicker"></span><h2 id="view-title"></h2><p id="view-summary"></p></div><div id="view-actions"></div></section>
<section class="chart-band" id="chart-band"><div class="chart-head"><h3 id="chart-title"></h3><span id="chart-note"></span></div><div class="canvas-wrap"><canvas id="chart" aria-label="Product analysis chart" role="img"></canvas><div id="chart-tooltip" class="tooltip" hidden></div></div></section>
<section id="shortlist-groups" hidden></section>
<section class="results"><div class="table-title"><h3 id="table-title">Product ranking</h3><span id="result-count" aria-live="polite"></span></div><div class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button id="prev" class="secondary" aria-label="Previous page" title="Previous page">&larr;</button><span id="page-label"></span><button id="next" class="secondary" aria-label="Next page" title="Next page">&rarr;</button></div></section>
<footer>CAD. Product-level inventory plan; size availability is not supplied. Gross profit excludes tax, shipping, fulfilment and marketing costs.</footer>
</main>
<dialog id="detail"><div class="dialog-head"><div><span class="eyebrow" id="detail-sku"></span><h2 id="detail-title"></h2></div><button class="secondary close" data-close="detail" aria-label="Close product details">&times;</button></div><div id="detail-content"></div></dialog>
<dialog id="audit"><div class="dialog-head"><h2>Data &amp; methodology</h2><button class="secondary close" data-close="audit" aria-label="Close data and methodology">&times;</button></div>
 <div class="settings-grid"><label>Minimum online units<input id="minStock" type="number" min="0" step="1"></label><label>Minimum BF margin %<input id="minMargin" type="number" min="0" max="100" step="1"></label><label>Minimum weeks of cover<input id="minCover" type="number" min="0" step="0.5"></label></div>
 <button id="apply-settings" class="primary">Apply thresholds</button><button id="reset-settings" class="secondary">Reset defaults</button>
 <div id="audit-content"></div>
</dialog>

 tip.innerHTML=point.row?`<strong>${esc(point.row.title)}</strong><small>${esc(point.row.sku)}</small><br>Online units: ${num(point.row.stock)}<br>Latest net sales: ${money(point.row.latest.sales)}<br>BF margin: ${pct(point.row.margin)}`:`<strong>${point.label} - ${shortDate(point.week.end)}</strong>Net sales: ${money(point.y)}${!point.week.complete?'<br>Incomplete source week':''}`;
 tip.style.left=Math.max(0,Math.min(x+12,rect.width-tip.offsetWidth-5))+'px';tip.style.top=Math.max(0,Math.min(y+12,rect.height-tip.offsetHeight-5))+'px';
});
$('chart').addEventListener('mouseleave',()=>{$('chart-tooltip').hidden=true;});
function openDetail(id){
 const r=state.rows.find(r=>r.row===Number(id));if(!r)return;
 $('detail-title').textContent=r.title;$('detail-sku').textContent=`${r.sku} / ${r.brand} / ${r.department}`;
 const items=[['Online inventory',num(r.stock)],['Latest net sales',r.matched?money(r.latest.sales):'No match'],['Latest net units',r.matched?num(r.latest.units):'No match'],['4-week avg units',r.matched?num(r.avgUnits):'No match'],['BF price',money(r.price)],['Cost per unit',money(r.cost)],['Gross profit / unit',money(r.gp)],['BF margin',pct(r.margin)],['Discount to current',pct(r.discount)],['Discount to MSRP',pct(r.msrpDiscount)],['Weeks of cover',r.cover===null?'Not available':num(r.cover)],['Units to match MSRP GP',r.profitMultiple===null?'Not available':r.profitMultiple.toFixed(2)+'x']];
 const wi=DATA.weeks.findIndex(w=>w.start===state.week),weeks=DATA.weeks.slice(Math.max(0,wi-4),wi+1),max=Math.max(1,...weeks.map(w=>r.history[w.start]?.units||0));
 $('detail-content').innerHTML=`<span class="decision ${bucketClass(r.bucket)}">${r.bucket} / Priority ${r.score}</span><p class="facts">${esc(r.reason)}</p><div class="detail-grid">${items.map(([k,v])=>`<div><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><h3>Weekly net units</h3><div class="detail-trend">${weeks.map(w=>{const n=r.history[w.start]?.units||0;return `<div class="trend-column"><span>${r.matched?num(n):'No match'}</span><i style="height:${Math.max(2,n/max*72)}px;${n<0?'background:var(--rose)':''}"></i><span>${shortDate(w.start)}</span></div>`;}).join('')}</div><p class="facts"><b>Offer:</b> ${esc(r.action)} / ${esc(r.duration)} / ${esc(r.channel||'Channel unconfirmed')}<br><b>Launch:</b> ${esc(r.start)} &nbsp; <b>End:</b> ${esc(r.end||'Not supplied')}<br><b>Phase:</b> ${esc(r.phase||'Not supplied')}<br><b>Workbook marketing flag:</b> ${esc(r.marketing||'None')}<br><b>MAP:</b> ${esc(r.map||'Not supplied')} / ${esc(r.mapStart||'No start')} to ${esc(r.mapEnd||'No end')}<br><b>Source:</b> ${esc(DATA.sheet)} row ${r.row}; ${esc(DATA.workbook)}<br><b>Inventory:</b> ECOM DC U AVAILABLE (BA). First-drop plan, not live inventory.<br><b>Size availability:</b> Not supplied.</p>${r.issues.length?'<h3>Review before featuring</h3><ul class="issues">'+r.issues.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':''}<button class="primary" data-pin="${r.sku}">${saved.has(r.sku)?'Remove from shortlist':'Save to shortlist'}</button>`;
 $('detail').showModal();
}
function openAudit(){
 for(const k of ['minStock','minMargin','minCover'])$(k).value=state.settings[k];
 const counts={unmatched:DATA.audit.unmatched,duplicate:DATA.audit.duplicateSkus.length,inventory:state.rows.filter(r=>!BFAnalysis.valid(r.stock)||r.stock<0).length,dates:state.rows.filter(r=>r.issues.some(i=>/date|launch|end/i.test(i))).length,margin:state.rows.filter(r=>r.margin===null||r.margin<0).length};
 $('audit-content').innerHTML=`<h3>Reconciliation</h3><p>${DATA.audit.sheetRows.toLocaleString()} source styles; ${DATA.audit.nonOfferRows.toLocaleString()} without planned prices/actions excluded. ${DATA.products.length} offer rows retained; ${DATA.audit.matched} SKUs have a sales match in loaded history.</p><div>${Object.entries(counts).map(([key,n])=>`<button class="secondary" data-issue="${key}">${key}: ${n}</button>`).join(' ')}</div><p>${DATA.audit.inputErrors.length} errors in imported analysis fields. Helper-column errors outside these fields are not used. Duplicate SKUs are held and excluded from headline totals; they are never silently added together.</p><h3>Sources &amp; timing</h3><p>${esc(DATA.workbook)} / ${esc(DATA.sheet)}, header row 5. STYLE ID (N) matches dashboard SKU after zero-padding to eight digits. Product titles are display labels, not join keys. Online exclusions also use EXCLUDE FROM ONLINE, column G.<br>${esc(DATA.inventoryLabel)}. Inventory and sales are not assumed to share a snapshot date. No inbound or store stock is added to online availability.</p><table><thead><tr><th>Sales source</th><th>Dates</th></tr></thead><tbody>${DATA.sources.map(s=>`<tr><td>${esc(s.path)}</td><td>${s.start} to ${s.end}</td></tr>`).join('')}</tbody></table><p>${DATA.missing.length?'Missing local sales files: '+DATA.missing.map(esc).join(', '):'All selected recent source files were available.'}</p><h3>Campaign dates</h3><p>Default first drop: Nov 14-25, 2026. New launches from Nov 26 are separated. Workbook dates are preserved: offers starting Nov 12 carry into the first window; Nov 19 offers are not assumed to start Nov 14. Missing dates, expired offers and end dates before launch require review. MAP-flagged products remain on hold pending approval. Second-drop inventory needs reconfirmation.</p><h3>Sales &amp; inventory</h3><p>Latest complete Sunday-Saturday week versus the preceding four complete weeks. Missing weeks suppress the average and automatic recommendations. Net units and net sales include returns; refund-adjustment rows and zero-value shipping rows follow the dashboard exclusions. No SKU match in the loaded history means unknown, not proven zero demand. Weeks of cover = online available units / average weekly positive units before returns; zero demand is displayed separately, not as infinite coverage. This is historical cover, not a BF forecast.</p><h3>Pricing &amp; margin</h3><p>Current online price = CN; MSRP = CJ; planned BF price = CW; unit cost = CQ. Gross profit per unit = BF price - cost. BF margin = gross profit / BF price. Margin change is versus current online margin. Units / regular GP = (MSRP - cost) / (BF price - cost); unavailable for nonpositive BF profit. These are gross margins, excluding tax, shipping, fulfilment and marketing costs. Inventory-weighted margin uses only unique products with valid costs, positive stock and valid BF prices.</p><h3>Priority methodology</h3><p>Heuristic score: 40% demand percentile (40% latest net units + 60% prior-four-week average); 20% unit momentum, capped at -100% to +100%; 20% cover, capped at six weeks; 20% margin, capped at 60%. Scores are calculated before display filters and are not forecasts. Hero: no holds, score at least 65, blended units at least five and positive latest units. Clearance: no holds and cover above 12 weeks, no positive recent unit sales, or blended units below two. Other eligible offers are supporting products. All rule failures are visible in product details.</p><h3>Publication</h3><p>This HTML embeds product costs, margins, inventory and aggregate sales. A public repository or public Pages site exposes that data. Use approved restricted hosting for confidential commercial information. No individual order records are included.</p>`;
 $('audit').showModal();
}
function exportCsv(){
 const headers=['SKU','Product','Brand','Department','Franchise','Decision','Priority score','Reason','Online units','MSRP','Current online price','BF price','Unit cost','BF GP per unit','BF margin %','Discount to current %','Margin change pp','Units to match MSRP GP','Latest net sales','Latest net units','Prior 4-week avg net sales','Prior 4-week avg net units','Unit change %','Weeks of cover','Launch date','End date','Channel','Source row','Saved'];
 const percent=n=>n===null?null:n*100;
 const rows=state.visible.map(r=>[r.sku,r.title,r.brand,r.department,r.franchise,r.bucket,r.score,r.reason,r.stock,r.msrp,r.current,r.price,r.cost,r.gp,percent(r.margin),percent(r.discount),percent(r.marginDrop),r.profitMultiple,r.matched?r.latest.sales:null,r.matched?r.latest.units:null,r.matched?r.avgSales:null,r.matched?r.avgUnits:null,percent(r.momentum),r.cover,r.start,r.end,r.channel,r.row,saved.has(r.sku)?'Yes':'No']);
 const quote=v=>{let s=v==null?'':String(v);if(typeof v==='string'&&/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 const csv='\uFEFF'+[headers,...rows].map(r=>r.map(quote).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`black-friday-${state.view}-${state.week}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.addEventListener('click',e=>{
 const sort=e.target.closest('[data-sort]');if(sort){state.dir=state.sort===sort.dataset.sort?-state.dir:-1;state.sort=sort.dataset.sort;state.page=0;render();}
 const tab=e.target.closest('[data-view]');if(tab){state.view=tab.dataset.view;state.page=0;state.sort=state.view==='momentum'?'momentum':state.view==='margin'?'margin':'score';state.dir=-1;render();}
 const detail=e.target.closest('[data-detail]');if(detail)openDetail(detail.dataset.detail);
 const pin=e.target.closest('[data-pin]');if(pin){const key=pin.dataset.pin;saved.has(key)?saved.delete(key):saved.add(key);try{localStorage.setItem('bf-planner:saved',JSON.stringify([...saved]));}catch{}if($('detail').open){$('detail').close();render();const r=state.rows.find(x=>x.sku===key);if(r)openDetail(r.row);}else render();}
 const close=e.target.closest('[data-close]');if(close)$(close.dataset.close).close();
 const issue=e.target.closest('[data-issue]');if(issue){state.issue=issue.dataset.issue;$('campaign').value='all';state.page=0;$('audit').close();recompute();}
});
let searchTimer;
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.page=0;render();},100);};
['brand','department','franchise','bucket','price-max'].forEach(id=>$(id).onchange=()=>{state.page=0;render();});
$('campaign').onchange=()=>{state.page=0;recompute();};$('week').onchange=()=>{state.week=$('week').value;state.page=0;recompute();};
$('reset').onclick=()=>{for(const id of ['search','brand','department','franchise','bucket','price-max'])$(id).value='';state.issue='';state.savedOnly=false;state.page=0;render();};
$('prev').onclick=()=>{state.page--;renderTable();};$('next').onclick=()=>{state.page++;renderTable();};
$('audit-open').onclick=openAudit;$('export').onclick=exportCsv;
$('apply-settings').onclick=()=>{for(const k of ['minStock','minMargin','minCover']){if(!$(k).reportValidity()||$(k).value==='')return;}for(const k of ['minStock','minMargin','minCover'])state.settings[k]=Number($(k).value);$('audit').close();state.page=0;recompute();};
$('reset-settings').onclick=()=>{state.settings={...BFAnalysis.defaults};$('audit').close();recompute();};
recompute();
</script>
